name: CI

# The jobs mirror the scripts `composer ci` runs locally, but run in parallel, so every failure
# on a pull request shows at once instead of one job at a time. `composer ci` keeps its cost
# order, so a local run still stops at the first failure. When a job's command changes here,
# change the matching `composer` script (and the other way round). The shared setup lives in
# `.github/actions/setup/action.yml`.
#
# RUN_REMOTE_CI: budget kill-switch.
# GitHub Actions minutes bill at the organization level, one pool shared by every UAMS-Web
# repository, and only private repositories consume them. Every job below, and every job in
# the pull-request workflows beside this one, is gated on `if: vars.RUN_REMOTE_CI != 'false'`:
# with the variable set to `false` the jobs report `skipped` and consume no runner minutes;
# unset, or any other value, runs them as before. A skipped job reports `Success`, so a green
# required check while the switch is off means nothing ran, not that the code passed;
# `composer ci` is the gate then. This template repository is private, so the switch is off
# here; the add-ons generated from it are public, where minutes are free and nobody sets the
# variable, so the gate does nothing there. `scripts/remote-ci-gate.test.mjs` fails when a job
# is added without it.
#
# REQUIRED CHECKS. The organization rulesets selected by the `required_checks` repository
# property (`ci-aggregate` and `pr-body`) require three contexts by that exact string: `CI`,
# `Attribution footer` and `Closing keywords`. Do not rename them: a required context no job
# reports blocks every pull request. Other job names are not listed in any ruleset, so
# renaming or adding a job needs no ruleset edit. Job names must stay unique across all
# workflows in this repository.
#
# AGGREGATE. The last job, `CI`, `needs:` every other job in this file, runs `if: always()`, and
# fails unless each of them succeeded, so a `skipped` or `cancelled` job fails it as well. It is
# the one context that `required_checks=ci-aggregate` requires, and it is the one job here that
# does not carry the RUN_REMOTE_CI gate: gated, it would be skipped with the rest, and a skipped
# required check reads as success. Add, rename or remove a job in this file and change the
# `needs:` list of `CI` in the same change. The `aggregate-needs` job runs
# `check-aggregate-needs.mjs`, which fails when a job is missing from that list. A job can only
# `needs:` jobs in its own workflow file, which is why the aggregate lives here and not in
# `synced-checks.yml`. Do not rename `CI`.

on:
  pull_request:
  push:
    branches: [main]
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  composer-validate:
    name: Composer validate (composer.lock freshness)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # Fails when composer.json and composer.lock have drifted apart.
      - run: composer validate --no-check-publish --no-check-all

  no-emoji:
    name: Repository guards (emoji, decision log)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the file and code points, when an emoji reaches a tracked record.
      - run: node scripts/check-no-emoji.mjs

      # Fails, naming the two entries, when docs/DECISIONS.md is out of order.
      - run: node scripts/check-decision-log-order.mjs

  scripts:
    name: Guard-script tests (vitest)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # `@statamic/cms` is a `file:` link into `vendor/statamic/cms`, so `npm ci` needs Composer's
      # install first.
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Node 22 bundles npm 10.9.x, below the `engines.npm` floor that `.npmrc`'s
      # engine-strict enforces, so `npm ci` refuses to run without this pin.
      - name: Pin npm to the engines floor
        run: npm install -g npm@^11.10.0

      - run: npm ci
      - run: npm run test:scripts

  built-assets:
    name: Built assets (resources/dist matches source)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Pin npm to the engines floor
        run: npm install -g npm@^11.10.0

      - run: npm ci

      # The built files are committed, because a Composer install does not run npm. A fresh
      # build that differs from what is committed means the sources changed without a rebuild.
      - run: npm run build
      - name: Fail if the committed build is out of date
        run: |
          changes=$(git status --porcelain -- resources/dist)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::resources/dist differs from a fresh build. Run npm run build and commit the result."
            exit 1
          fi

  mutate-ignore:
    name: Mutation annotations (none inert)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:mutate-ignore

  parallel-safe:
    name: Parallel-safe tests (no shared state)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # Dependency-free, so it needs PHP and nothing else.
      - run: composer test:parallel-safe

  pint:
    name: Pint
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:pint

  rector:
    name: Rector (gating profile)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:refactor

  phpstan:
    name: Larastan (PHPStan)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer stan

  pest:
    name: Pest (Unit and Integration)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # --log-junit feeds the band checks below; it changes nothing about what runs.
      - name: Run the suite
        run: composer test -- --display-all-issues --log-junit junit-parallel.xml

      # Fails when more tests skipped than tests/skip-baseline.json records (a silent skip
      # must not read as a pass), or when one class's cost nears the band's.
      - name: Check the band reports
        run: composer test:bands

  # The add-on promises `statamic/cms` at its `composer.json` constraint and PHP ^8.4, and every
  # job above runs one combination. These legs run the dependency-sensitive checks (Larastan and
  # Pest) against the others:
  #   - lowest: the lowest `statamic/cms` the constraint allows, with the dependencies it needs
  #     pulled to their lowest, so an API newer than the declared floor fails here.
  #   - php85: the locked dependencies on PHP 8.5.
  # The lowest bound is derived from the constraint in `composer.json`, never written here, so
  # raising the floor (when code starts to need a newer `statamic/cms` API) moves this leg with it.
  # Check names carry no version number for the same reason: the ruleset's list stays stable.
  # Only the `statamic/cms` dependency closure is lowered; the dev tooling stays locked. The
  # update rewrites `composer.lock` in the runner only.
  # Two jobs rather than one matrix job: a job skipped by the RUN_REMOTE_CI gate is skipped before
  # a matrix expands, so it would report the literal name `Compatibility (${{ matrix.name }})` and
  # the two required checks below would never report. Each job's `name:` is a required check.
  compatibility-lowest:
    name: Compatibility (lowest statamic/cms)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: '8.4'

      - name: Lower statamic/cms and its dependencies to their lowest allowed versions
        run: composer update statamic/cms --prefer-lowest --with-all-dependencies --no-interaction --no-progress

      - name: Show the resolved statamic/cms
        run: composer show statamic/cms | grep -E '^(name|versions)'

      - run: composer stan
      - run: composer test

  compatibility-php85:
    name: Compatibility (PHP 8.5)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: '8.5'

      - name: Show the resolved statamic/cms
        run: composer show statamic/cms | grep -E '^(name|versions)'

      - run: composer stan
      - run: composer test

  aggregate-needs:
    name: Aggregate needs (every job is in the CI needs list)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the job, when a job in this file is missing from the `needs:` list of `CI`
      # or a fixed required name is reported by no job. Allow-list: .github/aggregate-needs-allow.json.
      - run: node .claude/skills/code-quality/scripts/check-aggregate-needs.mjs

  # The one check `required_checks=ci-aggregate` requires from this workflow. Keep `needs:`
  # listing every other job in the file; `aggregate-needs` above fails when one is missing.
  ci:
    name: CI
    needs: [composer-validate, no-emoji, scripts, built-assets, mutate-ignore, parallel-safe, pint, rector, phpstan, pest, compatibility-lowest, compatibility-php85, aggregate-needs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list (an emptied `needs:`, a dropped `env:`) would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
